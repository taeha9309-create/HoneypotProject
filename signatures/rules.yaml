# 시그니처 규칙
#
# type: behavior = 공격 단계(정찰, 지속성 ...)를 잡는 규칙. 캠페인 카드의 단계 시퀀스·ATT&CK에 쓴다
#       campaign = 특정 공격 집단의 고유 흔적. 정답 세트 라벨링과 결과 검증에 쓴다
# patterns: 정규식 목록. 세션의 명령어 한 줄이라도 하나에 맞으면 그 규칙이 걸린 것
# sequence: 정규식 단계 목록. 같은 출처/세션에서 나열한 순서대로 모두 일치해야 한다.
# coverage: 2019-10-01~11-07 CyberLab SSH 명령어 세션 11,755개 기준 (규칙 초안 때 측정)

- id: B01
  name: 시스템 사양 조사
  type: behavior
  stage: 정찰
  attack: T1082
  detector: self_exe_read
  patterns:
    - '/proc/cpuinfo'
    - '\bfree\s+-[mgh]'
    - '\blscpu\b'
    - '\buname\b'
    - '\bnproc\b'
    - '(^|[;&|]\s*)top\b'
    - 'crontab\s+-l'
    - 'cat\s+/bin/(echo|ls|busybox)\b'  # 실행 파일 머리(ELF)로 CPU 종류 알아내기

- id: B02
  name: 접속자·계정 확인
  type: behavior
  stage: 정찰
  attack: T1033
  patterns:
    - '(^|[;&|]\s*)(w|who|whoami|id|last)\s*($|[;&|])'

- id: B03
  name: 비밀번호 변경
  type: behavior
  stage: 계정 장악
  attack: T1098
  detector: password_change
  note: '기존 patterns 판정을 보존하고 명령 위치의 NAME=value passwd/chpasswd 변형을 추가한다. 새 detector는 조회·도움말·인용 예시를 제외하지만 기존 정규식의 오탐 한계는 남는다. 변경 성공은 보장하지 않는다.'
  patterns:
    - '\bchpasswd\b'
    - '(^|[;&|]\s*)passwd\b'

- id: B04
  name: SSH 인증 키 파일 쓰기 시도
  type: behavior
  stage: 지속성
  attack: T1098.004
  detector: ssh_key_write
  note: 'literal .ssh/authorized_keys(2) 경로의 stdout 쓰기, cp/mv 목적지 또는 tee 대상 관측. 조회·검색·백업 복사는 제외한다. 실제 키 유효성·적용·악성 여부는 확정하지 않는다.'

- id: B05
  name: crontab에 작업 등록
  type: behavior
  stage: 지속성
  attack: T1053.003
  patterns:
    - '\bcrontab\s+(?!-l)'
    - '/etc/cron'
    - '/var/spool/cron'

- id: B06
  name: 명령 기록 끄기
  type: behavior
  stage: 방어 회피
  attack: T1562.003
  patterns:
    - '\bunset\s+[^;]*HIST'
    - 'HISTFILE'
    - 'HISTSIZE=0'
    - '\bhistory\s+-c'

- id: B07
  name: 로그 지우기
  type: behavior
  stage: 방어 회피
  attack: T1070.002
  patterns:
    - '(rm|>)\s*[^;|&]*(/var/log|wtmp|utmp|lastlog|\.bash_history)'

- id: B08
  name: 파일 내려받기
  type: behavior
  stage: 도구 반입
  attack: T1105
  patterns:
    - '\b(wget|curl|tftp|ftpget)\b'
    - '\bscp\s'

- id: B09
  name: base64로 숨긴 코드 풀기
  type: behavior
  stage: 방어 회피
  attack: T1140
  patterns:
    - '\bbase64\s+(--decode|-d)'

- id: B10
  name: 스크립트 실행
  type: behavior
  stage: 실행
  attack: T1059.004
  detector: shell_script
  patterns:
    - '\|\s*(ba)?sh\b'
    - '\b(perl|python[23]?)\s+\S+'
    - '(^|[;&|]\s*)\./\S+'
    - '\bsh\s+\S+\.sh\b'
    - '\bnohup\b'

- id: B11
  name: 실행 권한 주기
  type: behavior
  stage: 방어 회피
  attack: T1222.002
  detector: execute_permission

- id: B12
  name: 경쟁 프로세스 죽이기
  type: behavior
  stage: 영향
  attack: T1489  # 근사 매핑
  patterns:
    - '\b(pkill|killall)\b'
    - '\bkill\s+-9\b'

- id: B13
  name: 채굴기 흔적
  type: behavior
  stage: 영향
  attack: T1496
  patterns:
    - 'xmrig'
    - 'stratum\+tcp'
    - '\bminerd\b'
    - 'cryptonight'

- id: C01
  name: Outlaw dota 채굴 봇넷
  type: campaign
  note: 'Outlaw 그룹 소행으로 알려짐 — 보고서에 쓰기 전 출처 확인 필요'
  patterns:
    - 'dota'
    - '/var/tmp/\.var03522123'
    - '/tmp/up\.txt'

- id: C02
  name: SSH 키 심기 키트
  type: campaign
  patterns:
    - '\.ssh/\.auth_k'

- id: C03
  name: 로그 삭제 키트
  type: campaign
  patterns:
    - 'rm -rf /var/log/wtmp'

- id: C04
  name: Perl 봇 (read.txt)
  type: campaign
  patterns:
    - '\bread\.txt\b'

- id: C05
  name: 셸 스크립트 다운로더 (njs.sh / bins.sh)
  type: campaign
  note: '여러 서버 IP에서 같은 스크립트 이름을 받아 chmod 후 sh로 실행'
  patterns:
    - '\b(njs|bins)\.sh\b'

- id: S01
  name: 다운로드 후 실행 권한 부여 및 실행
  type: behavior
  stage: 실행
  attack: T1059.004
  note: 'Observes ordered input targeting the same literal path within a session.'
  session_detector: download_chmod_execute


# detector는 따옴표 밖의 명령 위치에서만 관측한다. 악성/성공 판정이 아니다.
- id: B14
  name: 16진수 문자열을 파일로 기록
  type: behavior
  stage: 도구 반입
  attack: T1027
  detector: hex_file_write
  note: 'echo/printf의 연속된 hex escape 4바이트 이상과 파일 리다이렉션 관측. 내용 실행·악성 여부는 보장하지 않는다.'

- id: B15
  name: 방화벽 규칙 비우기
  type: behavior
  stage: 방어 회피
  attack: T1562.004
  detector: firewall_flush
  note: 'iptables/ip6tables의 -F 또는 --flush 입력 관측. 관리 작업도 일치할 수 있다.'

- id: S02
  name: Base64 디코딩 결과를 인터프리터로 전달
  type: behavior
  stage: 실행
  attack: T1059
  detector: decode_pipeline
  note: '같은 입력에서 base64 -d/--decode의 stdout이 파이프로 bash/sh/perl의 프로그램 표준입력에 직접 연결된 구문. 악성 여부·디코딩 성공·실행 성공은 확정하지 않는다. 명령 치환·서브셸·후보 명령의 리다이렉션 등은 보수적으로 제외한다.'

- id: B16
  name: 임시 파일 쓰기·읽기·삭제 점검
  type: behavior
  stage: 정찰
  attack: T1083
  detector: file_write_probe
  note: '한 입력에서 같은 literal 경로에 echo/printf 출력→cat→rm을 순차 관측. 디렉터리 작업 가능 여부 탐색 후보로 근사 매핑하며 정상 배포 점검도 일치한다. 쓰기 성공·악성 판정이 아니다.'

- id: B17
  name: 실행 파일 위치·속성 조사
  type: behavior
  stage: 정찰
  attack: T1518
  detector: binary_inspection
  note: 'which, command -v/-V, type -p/-P와 제한된 ls/stat $(which PROGRAM) 입력 관측. 명령 치환을 실행하지 않으며 정상 관리 작업도 일치한다.'

# Input observations only: these rules do not prove maliciousness or success.
- id: B18
  name: 로컬 계정 목록 조회
  type: behavior
  stage: 정찰
  attack: T1087.001
  detector: local_account_read
  note: 'literal cat /etc/passwd 또는 getent passwd. B02(T1033)와 분리. 출력 내용과 성공은 미확인.'

- id: B19
  name: Unix 셸 진입 요청
  type: behavior
  stage: 실행
  attack: T1059.004
  detector: shell_entry
  note: 'sh/bash/ash/dash 단독 또는 제한된 대화형 옵션 입력. 낮은 특이도의 요청 관측이며 공격이나 실행 성공을 의미하지 않는다. B10의 스크립트 실행과 분리.'

- id: B20
  name: 파일·디렉터리 목록 조회
  type: behavior
  stage: 정찰
  attack: T1083
  detector: directory_listing
  note: 'literal ls 및 제한된 옵션. 정상 관리 작업도 일치하며 파일 접근 성공은 미확인.'

- id: B21
  name: 프로세스 자기 명령줄 조회
  type: behavior
  stage: 정찰
  patterns:
    - '\bcat\s+(/proc/)?self/cmdline\b'
  note: 'cat self/cmdline 입력 관측. 2026-11-23 고정 데이터(Telnet 15세션/15 IP, work/rule_candidates/FREEZE.md)와 2026-11-25 서울 홀드아웃(34세션/33 IP, 2026-11-18~24, work/rule_candidates/HOLDOUT_RESULTS_20261125.md)에서 재현 확인. 이 입력이 있는 세션 대부분은 이미 다른 규칙에도 걸려 신규 커버는 작다. ATT&CK 매핑은 근거 부족으로 비움(사람이 정한다).'

- id: B22
  name: SIP 요청 형태 입력
  type: behavior
  stage: 정찰
  patterns:
    - '^\s*Call-ID:\s'
    - '^\s*CSeq:\s*\d+\s+[A-Z]+'
    - '^\s*Max-Forwards:\s*\d'
    - '^\s*(From|To|Contact):\s*<sip:'
    - '^\s*Accept:\s*application/sdp'
    - '\bSIP/2\.0\b'
  note: 'Telnet 세션에서 SIP(인터넷 전화) 헤더 형태 입력 관측. 셸 명령이 아니라 다른 프로토콜 프로브로 보이나 확정하지 않는다. 2026-11-23 고정 데이터(Telnet 11세션/10 IP)와 2026-11-25 서울 홀드아웃(6세션/6 IP, 2026-11-20~25)에서 재현 확인. 일부 줄이 인증 필드로 기록되는 수집 단계 이슈가 있어 명령 필드만으로는 일부만 잡힌다. ATT&CK 매핑은 근거 부족으로 비움(셸 공격 행동이 아닐 수 있고, 사람이 정한다).'
